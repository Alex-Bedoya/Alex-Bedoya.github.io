<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 450" role="img" aria-labelledby="title description">
  <title id="title">Map of Utah</title>
  <desc id="description">A stylized dark map of Utah with neighboring states and geographic labels.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop offset="0" stop-color="#29263f"/>
      <stop offset="1" stop-color="#1b1a2a"/>
    </linearGradient>
    <linearGradient id="state" x2="1" y2="1">
      <stop offset="0" stop-color="#4c466a"/>
      <stop offset="1" stop-color="#35334f"/>
    </linearGradient>
    <pattern id="stars" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="1" fill="#c7b9ff" opacity=".35"/>
      <circle cx="27" cy="25" r=".8" fill="#ffb6c1" opacity=".3"/>
    </pattern>
    <clipPath id="state-clip">
      <path d="M104 60H277V91H310V376H104Z"/>
    </clipPath>
  </defs>
  <rect width="420" height="450" rx="8" fill="url(#background)"/>
  <g fill="#a9a2bb" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" opacity=".65">
    <text x="104" y="46">IDAHO</text>
    <text x="318" y="207">COLORADO</text>
    <text x="318" y="230">NEW MEXICO</text>
    <text x="35" y="254">NEVADA</text>
    <text x="37" y="315">ARIZONA</text>
    <text x="157" y="414">ARIZONA</text>
    <text x="112" y="395">37° N</text>
    <text x="110" y="83">42° N</text>
  </g>
  <path d="M104 60H277V91H310V376H104Z" fill="url(#state)" stroke="#b9aaff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M104 60H277V91H310V376H104Z" fill="url(#stars)" opacity=".8"/>
  <g clip-path="url(#state-clip)" fill="none" stroke="#d6c9ff" stroke-width="1" opacity=".14">
    <path d="M73 135C132 104 202 174 341 130M80 168C145 140 217 201 334 171M70 210C158 178 221 239 338 207M74 250C140 223 236 279 339 245M74 291C139 265 228 322 337 286M75 332C149 300 237 361 339 327"/>
    <path d="M132 45V390M180 45V390M228 45V390M276 45V390"/>
  </g>
  <g fill="#f5efd9" font-family="Georgia,serif" text-anchor="middle">
    <text x="204" y="213" font-size="27" letter-spacing="5">UTAH</text>
    <text x="204" y="232" fill="#b9aaff" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">THE BEEHIVE STATE</text>
  </g>
  <g fill="#d3cde0" font-family="Arial,sans-serif" font-size="9">
    <circle cx="187" cy="126" r="2" fill="#ff9eae"/>
    <text x="194" y="129">Salt Lake City</text>
    <circle cx="248" cy="291" r="2" fill="#ff9eae"/>
    <text x="255" y="294">Moab</text>
    <circle cx="135" cy="342" r="2" fill="#ff9eae"/>
    <text x="142" y="345">St. George</text>
  </g>
  <path d="M24 430H396" stroke="#b9aaff" opacity=".25"/>
  <text x="24" y="442" fill="#b4aec7" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.5">A LITTLE MAP OF MY UTAH RIDES</text>
</svg>
